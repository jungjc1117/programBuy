<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kiwoom 종목 분석 대시보드</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        background-color: #f4f4f4;
        margin: 0;
      }
      .container {
        width: 100%;
        max-width: 460px; /* 우측 Y축 공간 확보를 위해 소폭 확장 */
        box-sizing: border-box;
        margin: auto;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      #timestamp {
        text-align: right;
        font-size: 0.8em;
        color: #777;
        margin-bottom: 15px;
      }
      .market-section {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .market-title {
        width: 100%;
        font-size: 0.95em;
        font-weight: bold;
        color: #2c3e50;
        border-left: 4px solid #3498db;
        padding-left: 8px;
        margin-bottom: 8px;
        text-align: left;
        box-sizing: border-box;
      }
      .chart-wrapper {
        width: 100%;
        height: 250px; /* Y축 및 우측 지표 수용을 위해 높이 최적화 */
        background: #fafafa;
        border: 1px solid #e8e8e8;
        border-radius: 4px;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
      }
      .loading, .error, .no-data {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 0.85em;
        color: #888;
        width: 100%;
        text-align: center;
      }
      .error { color: red; }

      /* 대시보드 테이블 스타일 */
      .dashboard-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        font-size: 0.9em;
      }
      .dashboard-table th {
        background-color: #f8f9fa;
        color: #666;
        padding: 8px 10px;
        border-bottom: 2px solid #dee2e6;
        text-align: left;
      }
      .dashboard-table td {
        padding: 10px;
        border-bottom: 1px solid #eceeef;
        color: #333;
      }
      .dashboard-table tr.highlight-row {
        background-color: #fff5f5;
      }
      .rate-cell {
        text-align: right;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="timestamp">최종 업데이트: -</div>
      
      <!-- 통합 차트 구역 (알파 하이킨아시, 이중 Y축, 우측 지표 라인 가이드 매핑) -->
      <div class="market-section">
        <div class="market-title">알파 하이킨아시 & MFI(14) 차트 (더블 Y축)</div>
        <div class="chart-wrapper">
          <canvas id="stock-chart" width="440" height="250"></canvas>
          <div id="stock-msg" class="loading">데이터를 불러오는 중...</div>
        </div>
      </div>

      <!-- 8대 가격 지표 대시보드 구역 -->
      <div class="market-title">가격 지표 변동률 순위 (내림차순)</div>
      <table class="dashboard-table">
        <thead>
          <tr>
            <th>비교 지표 항목</th>
            <th style="text-align: right;">해당 가격</th>
            <th style="text-align: right;">대비 등락률</th>
          </tr>
        </thead>
        <tbody id="dashboard-tbody">
          <tr>
            <td colspan="3" style="text-align: center; color: #999;">데이터를 수신하면 순위가 표시됩니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      let cachedToken = null;

      const accessParams = {
        grant_type: "client_credentials",
        appkey: "-iQmyxQBQb0jmIS-JTaAbsQ1r7u3NhoMX78hMqBsobY",
        secretkey: "y-fGxZn2OnsyvyqR9kXlTqUiwMuk6IJd6k3xeox0PTo",
      };

      const chartParams = { stk_cd: '039490_AL', base_dt: '20261231', upd_stkpc_tp: '0' };

      async function fetchToken() {
        if (cachedToken) return cachedToken;
        const url = "https://mockapi.kiwoom.com/oauth2/token";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(accessParams),
        });
        if (!res.ok) throw new Error(`토큰 발급 에러: ${res.status}`);
        const data = await res.json();
        cachedToken = data.token || data.access_token;
        return cachedToken;
      }

      async function fetchMarketData(token, params) {
        const url = "https://mockapi.kiwoom.com/api/dostk/chart";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json;charset=UTF-8",
            authorization: `Bearer ${token}`,
            "api-id": "ka10081",
            "cont-yn": "N",
            "next-key": "",
          },
          body: JSON.stringify(params),
        });
        if (!res.ok) {
          if (res.status === 401) cachedToken = null; 
          throw new Error(`데이터 통신 에러: ${res.status}`);
        }
        const data = await res.json();
        return data.stk_dt_pole_chart_qry || [];
      }

      function parsePrice(value) {
        if (!value) return 0;
        let cleanValue = String(value).replace(/[^0-9.-]/g, '');
        return Math.abs(parseFloat(cleanValue)) || 0;
      }

      // 단순 이동평균(SMA) 계산 도구 함수
      function calculateSMA(values, period) {
        let sma = new Array(values.length).fill(0);
        let sum = 0;
        for (let i = 0; i < values.length; i++) {
          sum += values[i];
          if (i >= period - 1) {
            sma[i] = sum / period;
            sum -= values[i - period + 1];
          } else {
            sma[i] = i > 0 ? sum / (i + 1) : values[0];
          }
        }
        return sma;
      }

      // MFI (Money Flow Index) 계산 함수
      function calculateMFI(data, period = 14) {
        let mfiValues = new Array(data.length).fill(null);
        let typicalPrices = data.map(d => (d.high + d.low + d.close) / 3);

        for (let i = 1; i < data.length; i++) {
          data[i].rawMoneyFlow = typicalPrices[i] * data[i].volume;
          data[i].flowDirection = typicalPrices[i] > typicalPrices[i - 1] ? 'positive' : (typicalPrices[i] < typicalPrices[i - 1] ? 'negative' : 'flat');
        }

        for (let i = period; i < data.length; i++) {
          let posFlow = 0;
          let negFlow = 0;
          for (let j = i - period + 1; j <= i; j++) {
            if (data[j].flowDirection === 'positive') posFlow += data[j].rawMoneyFlow;
            if (data[j].flowDirection === 'negative') negFlow += data[j].rawMoneyFlow;
          }
          if (negFlow === 0) mfiValues[i] = 100;
          else mfiValues[i] = 100 - (100 / (1 + (posFlow / negFlow)));
        }
        return mfiValues;
      }

      // 8대 가격 지표 계산 핵심 모듈 (차트 우측 맵핑과 일치되도록 데이터 사전 추출)
      function extractDashboardMetrics(sortedData) {
        if (!sortedData || sortedData.length < 2) return [];
        
        const today = sortedData[0];
        const yesterday = sortedData[1];
        const curPrc = today.close;       
        const prevClose = yesterday.close; 
        const prevHigh = yesterday.high;   
        const todayHigh = today.high;     

        const avg3 = sortedData.slice(0, 3).reduce((acc, d) => acc + d.close, 0) / Math.min(sortedData.length, 3);
        const avg5 = sortedData.slice(0, 5).reduce((acc, d) => acc + d.close, 0) / Math.min(sortedData.length, 5);
        const max60 = Math.max(...sortedData.slice(0, 60).map(d => d.high));

        return [
          { name: "3일 가격평균", price: avg3, rate: ((avg3 - curPrc) / curPrc) * 100, isCurrent: false },
          { name: "5일 가격평균", price: avg5, rate: ((avg5 - curPrc) / curPrc) * 100, isCurrent: false },
          { name: "60일 고가", price: max60, rate: ((max60 - curPrc) / curPrc) * 100, isCurrent: false },
          { name: "현재가격", price: curPrc, rate: ((curPrc - prevClose) / prevClose) * 100, isCurrent: true }, 
          { name: "전일종가", price: prevClose, rate: ((prevClose - curPrc) / curPrc) * 100, isCurrent: false },
          { name: "전일고가", price: prevHigh, rate: ((prevHigh - curPrc) / curPrc) * 100, isCurrent: false },
          { name: "당일고가", price: todayHigh, rate: ((todayHigh - curPrc) / curPrc) * 100, isCurrent: false }
        ];
      }

      // 하이킨아시, 알파 하이킨아시, MFI, 다중 Y축 및 우측 가이드 컴포넌트 드로잉 엔진
      function drawCandleChart(canvas, rawData) {
        if (!rawData || rawData.length === 0) return;

        let parsedData = rawData.map(item => ({
          date: item.dt || "",
          open: parsePrice(item.open_pric),
          high: parsePrice(item.high_pric),
          low: parsePrice(item.low_pric),
          close: parsePrice(item.cur_prc),
          volume: parsePrice(item.trde_qty)
        })).filter(d => d.date !== "");

        // 시계열 오름차순 정렬 (과거 -> 현재)
        parsedData.sort((a, b) => a.date.localeCompare(b.date));

        // 우측 비교 지표 매핑을 위한 내림차순 복사본 데이터 추출
        let descData = [...parsedData].reverse();
        let indicatorMetrics = extractDashboardMetrics(descData);

        // --- 알파 하이킨아시(Smoothed Heikin-Ashi) 내부 파이프라인 연산 ---
        // 1단계: 원본 가격 데이터 5일 스무딩(SMA) 필터링
        let smoothOpen = calculateSMA(parsedData.map(d => d.open), 5);
        let smoothHigh = calculateSMA(parsedData.map(d => d.high), 5);
        let smoothLow = calculateSMA(parsedData.map(d => d.low), 5);
        let smoothClose = calculateSMA(parsedData.map(d => d.close), 5);

        // 2단계: 필터링된 가격 기반 1차 하이킨아시 계산
        let haData1 = [];
        for (let i = 0; i < parsedData.length; i++) {
          let hClose = (smoothOpen[i] + smoothHigh[i] + smoothLow[i] + smoothClose[i]) / 4;
          let hOpen = i === 0 ? smoothOpen[i] : (haData1[i - 1].open + haData1[i - 1].close) / 2;
          let hHigh = Math.max(smoothHigh[i], hOpen, hClose);
          let hLow = Math.min(smoothLow[i], hOpen, hClose);
          haData1.push({ open: hOpen, high: hHigh, low: hLow, close: hClose });
        }

        // 3단계: 최종 알파 하이킨아시 도출을 위한 3일 2차 평활화 연산
        let alphaOpen = calculateSMA(haData1.map(d => d.open), 3);
        let alphaHigh = calculateSMA(haData1.map(d => d.high), 3);
        let alphaLow = calculateSMA(haData1.map(d => d.low), 3);
        let alphaClose = calculateSMA(haData1.map(d => d.close), 3);

        // MFI 연산 레이어 결합
        let mfiArray = calculateMFI(parsedData, 14);

        // 4단계: 최종 마스터 차트 데이터 매핑 조합 구조화
        let masterData = parsedData.map((current, index) => ({
          date: current.date,
          open: current.open, high: current.high, low: current.low, close: current.close, // 기본 캔들
          aOpen: alphaOpen[index], aHigh: alphaHigh[index], aLow: alphaLow[index], aClose: alphaClose[index], // 알파 하이킨아시
          mfi: mfiArray[index]
        }));

        // 화면 표출 제한 스코프 설정 (최근 60 거래일)
        let chartData = masterData.slice(-60);

        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // 레이아웃 치수 설계 (우측 Y축 및 가이드 표시 마진 확보)
        const paddingLeft = 10;
        const paddingRight = 75; // Y축 텍스트 및 등락률 캡션 공간 증가
        const priceChartHeight = 150;
        const mfiChartTop = 185;
        const mfiChartHeight = 50;
        const paddingY = 15;

        // 가용한 X축 드로잉 폭 연산
        const availableWidth = width - paddingLeft - paddingRight;
        const dataCount = chartData.length;
        const xStep = dataCount > 1 ? availableWidth / (dataCount - 1) : availableWidth;
        const candleWidth = Math.max(3, (availableWidth / dataCount) * 0.65);

        // 가격 고저 범위 계산 (기본 및 알파 통합 맥스값 검출)
        const highs = chartData.map(d => Math.max(d.high, d.aHigh));
        const lows = chartData.map(d => Math.min(d.low, d.aLow));
        const maxPrice = Math.max(...highs);
        const minPrice = Math.min(...lows);
        const priceRange = maxPrice - minPrice || 1;

        ctx.clearRect(0, 0, width, height);

        // 축 스케일 변환 헬퍼 함수
        function getPriceY(price) {
          const usableHeight = priceChartHeight - (paddingY * 2);
          return priceChartHeight - paddingY - ((price - minPrice) / priceRange) * usableHeight;
        }

        function getMfiY(mfiValue) {
          if (mfiValue === null) return null;
          return mfiChartTop + mfiChartHeight - (mfiValue / 100) * mfiChartHeight;
        }

        // ==========================================
        // 1. 가격 차트 영역 우측 Y축 (Price Y-Axis) 렌더링
        // ==========================================
        ctx.strokeStyle = '#e8e8e8';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(width - paddingRight + 3, paddingY - 5);
        ctx.lineTo(width - paddingRight + 3, priceChartHeight - paddingY + 5);
        ctx.stroke();

        ctx.fillStyle = '#555555';
        ctx.font = '9px Arial';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';

        const priceTicks = 4;
        for (let i = 0; i <= priceTicks; i++) {
          let targetPrice = minPrice + (priceRange / priceTicks) * i;
          let yPos = getPriceY(targetPrice);
          
          // 가로 그리드 점선 보조선
          ctx.strokeStyle = '#f1f2f6';
          ctx.beginPath();
          ctx.moveTo(paddingLeft, yPos);
          ctx.lineTo(width - paddingRight, yPos);
          ctx.stroke();

          // Y축 단위 수치 출력
          ctx.fillText(Math.round(targetPrice).toLocaleString(), width - paddingRight + 8, yPos);
        }

        // ==========================================
        // 2. MFI 차트 영역 우측 Y축 및 기준선 렌더링
        // ==========================================
        ctx.strokeStyle = '#e8e8e8';
        ctx.beginPath();
        ctx.moveTo(width - paddingRight + 3, mfiChartTop - 5);
        ctx.lineTo(width - paddingRight + 3, mfiChartTop + mfiChartHeight + 5);
        ctx.stroke();

        [20, 50, 80].forEach(level => {
          let yPos = getMfiY(level);
          ctx.strokeStyle = level === 50 ? '#d1d8e0' : '#f1f2f6';
          ctx.setLineDash(level === 50 ? [] : [3, 3]);
          
          ctx.beginPath();
          ctx.moveTo(paddingLeft, yPos);
          ctx.lineTo(width - paddingRight, yPos);
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = level === 50 ? '#2c3e50' : '#7f8c8d';
          ctx.font = 'bold 9px Arial';
          ctx.fillText(level, width - paddingRight + 8, yPos);
        });

        // ==========================================
        // 3. 메인 데이터 루프 (알파 하이킨아시 & 일반 캔들 오버레이)
        // ==========================================
        let mfiPoints = [];

        chartData.forEach((candle, index) => {
          const x = paddingLeft + (index * xStep);

          // [A] 배경: 일반 가격 변동 캔들 (투명도 조절로 알파 채널과 분리성 제공)
          const yOpen = getPriceY(candle.open);
          const yClose = getPriceY(candle.close);
          const yHigh = getPriceY(candle.high);
          const yLow = getPriceY(candle.low);
          
          ctx.strokeStyle = candle.close >= candle.open ? 'rgba(225,112,85,0.25)' : 'rgba(9,132,227,0.25)';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(x, yHigh); ctx.lineTo(x, yLow); ctx.stroke();
          ctx.fillStyle = candle.close >= candle.open ? 'rgba(225,112,85,0.15)' : 'rgba(9,132,227,0.15)';
          ctx.fillRect(x - (candleWidth / 2), Math.min(yOpen, yClose), candleWidth, Math.max(1, Math.abs(yClose - yOpen)));

          // [B] 전경: 메인 알파 하이킨아시 (Smoothed Heikin-Ashi) 캔들 시스템
          const yaOpen = getPriceY(candle.aOpen);
          const yaClose = getPriceY(candle.aClose);
          const yaHigh = getPriceY(candle.aHigh);
          const yaLow = getPriceY(candle.aLow);

          // 하이킨아시 전용 추세 컬러 매칭
          let alphaColor = yaClose > yaOpen ? '#e17055' : '#0984e3'; 
          ctx.strokeStyle = alphaColor;
          ctx.fillStyle = alphaColor;
          ctx.lineWidth = 1.8; // 뼈대 시인성 강조

          ctx.beginPath();
          ctx.moveTo(x, yaHigh);
          ctx.lineTo(x, yaLow);
          ctx.stroke();

          ctx.fillRect(x - (candleWidth / 2), Math.min(yaOpen, yaClose), candleWidth, Math.max(1, Math.abs(yaClose - yaOpen)));

          // [C] 보조지표: MFI선 가용 포인트 축적
          const mfiY = getMfiY(candle.mfi);
          if (mfiY !== null) mfiPoints.push({ x: x, y: mfiY });
        });

        // MFI 라인 패스 연결 실행
        if (mfiPoints.length > 0) {
          ctx.strokeStyle = '#6c5ce7';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(mfiPoints[0].x, mfiPoints[0].y);
          for (let p = 1; p < mfiPoints.length; p++) ctx.lineTo(mfiPoints[p].x, mfiPoints[p].y);
          ctx.stroke();
        }

        // ==========================================
        // 4. 가격지표 대시보드 변동률 우측 연계 가이드 맵핑
        // ==========================================
        // 등락률 높은 순으로 재정렬하여 우측 고저 공간 배치 최적화
        let sortedMetrics = [...indicatorMetrics].sort((a, b) => b.price - a.price);
        
        ctx.font = '8px Dotum, Arial';
        ctx.textAlign = 'left';

        sortedMetrics.forEach((item, idx) => {
          let itemY = getPriceY(item.price);
          
          // 차트 외부 밖 영역으로 이탈하는 텍스트 보호 예외 처리
          if(itemY < paddingY) itemY = paddingY + (idx * 2);
          if(itemY > priceChartHeight - paddingY) itemY = priceChartHeight - paddingY;

          // 현재가 강조 스키마 설정
          if (item.isCurrent) {
            ctx.fillStyle = '#d63031';
            ctx.font = 'bold 8px Arial';
          } else {
            ctx.fillStyle = '#747d8c';
            ctx.font = '8px Arial';
          }

          // 인디케이터 캡션 텍스트 출력 데이터 조합
          let textSpec = `${item.name}`;
          ctx.fillText(textSpec, width - paddingRight + 42, itemY);

          // 우측 필드 가이드 지표선 서포트 렌더링
          ctx.strokeStyle = item.isCurrent ? 'rgba(214, 48, 49, 0.4)' : 'rgba(116, 125, 140, 0.2)';
          ctx.beginPath();
          ctx.moveTo(width - paddingRight + 5, itemY);
          ctx.lineTo(width - paddingRight + 38, itemY);
          ctx.stroke();
        });
      }

      // 8대 가격 지표 대시보드 하단 테이블 연동 렌더러
      function makePriceDashboard(rawData) {
        if (!rawData || rawData.length < 2) return;

        let sortedData = rawData.map(item => ({
          open: parsePrice(item.open_pric),
          high: parsePrice(item.high_pric),
          low: parsePrice(item.low_pric),
          close: parsePrice(item.cur_prc)
        }));
        
        let descData = [...sortedData];
        let dashboardItems = extractDashboardMetrics(descData);

        dashboardItems.sort((a, b) => b.rate - a.rate);

        const tbody = document.getElementById("dashboard-tbody");
        tbody.innerHTML = dashboardItems.map(item => {
          const sign = item.rate > 0 ? "+" : "";
          const displayRate = `${sign}${item.rate.toFixed(2)}%`;
          const displayPrice = Math.round(item.price).toLocaleString();
          
          const rowClass = item.isCurrent ? "class='highlight-row'" : "";
          const customStyle = item.isCurrent ? "style='color: #d63031; font-weight: bold;'" : "";

          return `
            <tr ${rowClass} ${customStyle}>
              <td>${item.name}</td>
              <td style="text-align: right;">${displayPrice}</td>
              <td class="rate-cell">${displayRate}</td>
            </tr>
          `;
        }).join("");
      }

      function updateTimestamp() {
        const timestampElement = document.getElementById("timestamp");
        if (timestampElement) {
          const now = new Date();
          timestampElement.innerText = `최종 업데이트: ${now.toLocaleTimeString()}`;
        }
      }

      async function updateData() {
        try {
          const token = await fetchToken();

          try {
            const stockData = await fetchMarketData(token, chartParams);
            
            const canvas = document.getElementById("stock-chart");
            document.getElementById("stock-msg").innerText = "";
            drawCandleChart(canvas, stockData);
            makePriceDashboard(stockData);

          } catch (err) {
            document.getElementById("stock-msg").className = "error";
            document.getElementById("stock-msg").innerText = `종목 데이터 수신 실패`;
          }

          updateTimestamp();

        } catch (e) {
          console.error("인증 에러:", e);
          const el = document.getElementById("stock-msg");
          if(el) { el.className = "error"; el.innerText = "인증 오류 또는 서버 점검"; }
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateData();
      });
    </script>
  </body>
</html>
