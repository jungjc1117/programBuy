<!--종목일봉-->
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kiwoom 종목 분석 대시보드</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        background-color: #f4f4f4;
        margin: 0;
      }
      .container {
        width: 100%;
        max-width: 430px;
        box-sizing: border-box;
        margin: auto;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      #timestamp {
        text-align: right;
        font-size: 0.8em;
        color: #777;
        margin-bottom: 15px;
      }
      .market-section {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .market-title {
        width: 100%;
        font-size: 0.95em;
        font-weight: bold;
        color: #2c3e50;
        border-left: 4px solid #3498db;
        padding-left: 8px;
        margin-bottom: 8px;
        text-align: left;
        box-sizing: border-box;
      }
      .chart-wrapper {
        width: 100%;
        height: 230px; /* MFI 지표 공간 확보를 위해 높이 확장 */
        background: #fafafa;
        border: 1px solid #e8e8e8;
        border-radius: 4px;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
      }
      .loading, .error, .no-data {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 0.85em;
        color: #888;
        width: 100%;
        text-align: center;
      }
      .error { color: red; }

      /* 대시보드 테이블 스타일 */
      .dashboard-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        font-size: 0.9em;
      }
      .dashboard-table th {
        background-color: #f8f9fa;
        color: #666;
        padding: 8px 10px;
        border-bottom: 2px solid #dee2e6;
        text-align: left;
      }
      .dashboard-table td {
        padding: 10px;
        border-bottom: 1px solid #eceeef;
        color: #333;
      }
      .dashboard-table tr.highlight-row {
        background-color: #fff5f5;
      }
      .rate-cell {
        text-align: right;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="timestamp">최종 업데이트: -</div>
      
      <!-- 하이킨아시 & MFI 차트 구역 -->
      <div class="market-section">
        <div class="market-title">하이킨아시 및 MFI(14) 차트</div>
        <div class="chart-wrapper">
          <canvas id="stock-chart" width="400" height="230"></canvas>
          <div id="stock-msg" class="loading">데이터를 불러오는 중...</div>
        </div>
      </div>

      <!-- 8대 가격 지표 대시보드 구역 -->
      <div class="market-title">가격 지표 변동률 순위 (내림차순)</div>
      <table class="dashboard-table">
        <thead>
          <tr>
            <th>비교 지표 항목</th>
            <th style="text-align: right;">해당 가격</th>
            <th style="text-align: right;">대비 등락률</th>
          </tr>
        </thead>
        <tbody id="dashboard-tbody">
          <tr>
            <td colspan="3" style="text-align: center; color: #999;">데이터를 수신하면 순위가 표시됩니다.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      let cachedToken = null;

      const accessParams = {
        grant_type: "client_credentials",
        appkey: "-iQmyxQBQb0jmIS-JTaAbsQ1r7u3NhoMX78hMqBsobY",
        secretkey: "y-fGxZn2OnsyvyqR9kXlTqUiwMuk6IJd6k3xeox0PTo",
      };

      const chartParams = { stk_cd: '039490_AL', base_dt: '20261231', upd_stkpc_tp: '0' };
      const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function fetchToken() {
        if (cachedToken) return cachedToken;
        const url = "https://mockapi.kiwoom.com/oauth2/token";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(accessParams),
        });
        if (!res.ok) throw new Error(`토큰 발급 에러: ${res.status}`);
        const data = await res.json();
        cachedToken = data.token || data.access_token;
        return cachedToken;
      }

      async function fetchMarketData(token, params) {
        const url = "https://mockapi.kiwoom.com/api/dostk/chart";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json;charset=UTF-8",
            authorization: `Bearer ${token}`,
            "api-id": "ka10081",
            "cont-yn": "N",
            "next-key": "",
          },
          body: JSON.stringify(params),
        });
        if (!res.ok) {
          if (res.status === 401) cachedToken = null; 
          throw new Error(`데이터 통신 에러: ${res.status}`);
        }
        const data = await res.json();
        return data.stk_dt_pole_chart_qry || [];
      }

      function parsePrice(value) {
        if (!value) return 0;
        let cleanValue = String(value).replace(/[^0-9.-]/g, '');
        return Math.abs(parseFloat(cleanValue)) || 0;
      }

      // MFI (Money Flow Index) 계산 함수
      function calculateMFI(data, period = 14) {
        let mfiValues = new Array(data.length).fill(null);
        
        // Typical Price 계산
        let typicalPrices = data.map(d => (d.high + d.low + d.close) / 3);

        for (let i = 1; i < data.length; i++) {
          data[i].rawMoneyFlow = typicalPrices[i] * data[i].volume;
          data[i].flowDirection = typicalPrices[i] > typicalPrices[i - 1] ? 'positive' : (typicalPrices[i] < typicalPrices[i - 1] ? 'negative' : 'flat');
        }

        for (let i = period; i < data.length; i++) {
          let posFlow = 0;
          let negFlow = 0;

          for (let j = i - period + 1; j <= i; j++) {
            if (data[j].flowDirection === 'positive') posFlow += data[j].rawMoneyFlow;
            if (data[j].flowDirection === 'negative') negFlow += data[j].rawMoneyFlow;
          }

          if (negFlow === 0) {
            mfiValues[i] = 100;
          } else {
            let moneyRatio = posFlow / negFlow;
            mfiValues[i] = 100 - (100 / (1 + moneyRatio));
          }
        }
        return mfiValues;
      }

      // 하이킨아시 및 MFI 통합 차트 그리기
      function drawCandleChart(canvas, rawData) {
        if (!rawData || rawData.length === 0) return;

        // 1. 원본 데이터 파싱 및 시간순(오름차순) 정렬 기본 세팅
        let parsedData = rawData.map(item => ({
          date: item.dt || "",
          open: parsePrice(item.open_pric),
          high: parsePrice(item.high_pric),
          low: parsePrice(item.low_pric),
          close: parsePrice(item.cur_prc),
          volume: parsePrice(item.trde_qty) // 거래량 변수 바인딩
        })).filter(d => d.date !== "");

        // 시간 축 정렬 (과거 -> 최신)
        parsedData.sort((a, b) => a.date.localeCompare(b.date));

        // 2. MFI 전체 배열 선행 계산 (14일 기간)
        let mfiArray = calculateMFI(parsedData, 14);

        // 3. 하이킨아시 보정 배열 전체 계산 (과거 데이터부터 누적 계산 필요)
        let haData = [];
        parsedData.forEach((current, index) => {
          let haClose = (current.open + current.high + current.low + current.close) / 4;
          let haOpen = index === 0 ? current.open : (haData[index - 1].open + haData[index - 1].close) / 2;
          let haHigh = Math.max(current.high, haOpen, haClose);
          let haLow = Math.min(current.low, haOpen, haClose);

          haData.push({
            date: current.date,
            open: haOpen,
            high: haHigh,
            low: haLow,
            close: haClose,
            mfi: mfiArray[index]
          });
        });

        // 4. 최종 화면 표시용 최근 60개 데이터 추출
        let chartData = haData.slice(-60);

        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // 레이아웃 분할 (상단 140px 하이킨아시 차트 / 하단 60px MFI 보조지표)
        const priceChartHeight = 140;
        const mfiChartTop = 165;
        const mfiChartHeight = 50;

        const paddingY = 15;
        const paddingX = 10;

        // 화면 60개 기준 최고가/최저가 스케일 계산
        const highs = chartData.map(d => d.high);
        const lows = chartData.map(d => d.low);
        const maxPrice = Math.max(...highs);
        const minPrice = Math.min(...lows);
        const priceRange = maxPrice - minPrice || 1;

        const dataCount = chartData.length;
        const availableWidth = width - (paddingX * 2);
        const xStep = dataCount > 1 ? availableWidth / (dataCount - 1) : availableWidth;
        const candleWidth = Math.max(3, (availableWidth / dataCount) * 0.65);

        ctx.clearRect(0, 0, width, height);

        // 가격 변환 축함수
        function getCanvasY(price) {
          const usableHeight = priceChartHeight - (paddingY * 2);
          return priceChartHeight - paddingY - ((price - minPrice) / priceRange) * usableHeight;
        }

        // MFI 변환 축함수 (MFI는 0 ~ 100 범위 고정 고저 스케일)
        function getMfiY(mfiValue) {
          if (mfiValue === null) return null;
          return mfiChartTop + mfiChartHeight - (mfiValue / 100) * mfiChartHeight;
        }

        // --- 구역 구분선 그리기 ---
        ctx.strokeStyle = '#e8e8e8';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, mfiChartTop - 10);
        ctx.lineTo(width, mfiChartTop - 10);
        ctx.stroke();

        // --- MFI 기준선 그리기 (20, 50, 80 과매도/과매수 점선 영역) ---
        ctx.lineWidth = 1;
        [20, 50, 80].forEach(level => {
          ctx.strokeStyle = level === 50 ? '#b2bec3' : '#dfe6e9';
          ctx.setLineDash(level === 50 ? [] : [3, 3]);
          ctx.beginPath();
          ctx.moveTo(paddingX, getMfiY(level));
          ctx.lineTo(width - paddingX, getMfiY(level));
          ctx.stroke();
        });
        ctx.setLineDash([]); // 라인 스타일 초기화

        // --- 메인 루프 드로잉 ---
        let mfiPoints = [];

        chartData.forEach((candle, index) => {
          const x = paddingX + (index * xStep);
          
          // 1. 하이킨아시 캔들 그리기
          const yOpen = getCanvasY(candle.open);
          const yClose = getCanvasY(candle.close);
          const yHigh = getCanvasY(candle.high);
          const yLow = getCanvasY(candle.low);

          let themeColor = '#7f8c8d';
          if (candle.close > candle.open) themeColor = '#e17055'; // 하이킨아시 양봉 (상승 추세 유지)
          else if (candle.close < candle.open) themeColor = '#0984e3'; // 하이킨아시 음봉 (하락 추세 유지)

          ctx.strokeStyle = themeColor;
          ctx.fillStyle = themeColor;
          ctx.lineWidth = 1.2;

          ctx.beginPath();
          ctx.moveTo(x, yHigh);
          ctx.lineTo(x, yLow);
          ctx.stroke();

          const bodyHeight = Math.abs(yClose - yOpen);
          const bodyX = x - (candleWidth / 2);
          const bodyY = Math.min(yOpen, yClose);

          if (bodyHeight === 0) {
            ctx.beginPath();
            ctx.moveTo(x - (candleWidth / 2), bodyY);
            ctx.lineTo(x + (candleWidth / 2), bodyY);
            ctx.stroke();
          } else {
            ctx.fillRect(bodyX, bodyY, candleWidth, bodyHeight);
          }

          // 2. MFI 포인트 수집
          const mfiY = getMfiY(candle.mfi);
          if (mfiY !== null) {
            mfiPoints.push({ x: x, y: mfiY });
          }
        });

        // 3. MFI 선 연결해서 그리기
        if (mfiPoints.length > 0) {
          ctx.strokeStyle = '#6c5ce7'; // MFI 라인은 보라색으로 강조
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(mfiPoints[0].x, mfiPoints[0].y);
          for (let p = 1; p < mfiPoints.length; p++) {
            ctx.lineTo(mfiPoints[p].x, mfiPoints[p].y);
          }
          ctx.stroke();
        }
      }

      // 8대 가격 지표 계산 및 대시보드 정렬 출력 함수
      function makePriceDashboard(rawData) {
        if (!rawData || rawData.length < 2) return;

        let sortedData = rawData.map(item => ({
          open: parsePrice(item.open_pric),
          high: parsePrice(item.high_pric),
          low: parsePrice(item.low_pric),
          close: parsePrice(item.cur_prc)
        }));
        
        const today = sortedData[0];
        const yesterday = sortedData[1];

        const curPrc = today.close;       
        const prevClose = yesterday.close; 
        const prevHigh = yesterday.high;   
        const todayHigh = today.high;     

        const avg3 = sortedData.slice(0, 3).reduce((acc, d) => acc + d.close, 0) / Math.min(sortedData.length, 3);
        const avg5 = sortedData.slice(0, 5).reduce((acc, d) => acc + d.close, 0) / Math.min(sortedData.length, 5);
        const avgAll = sortedData.reduce((acc, d) => acc + d.close, 0) / sortedData.length;
        const max60 = Math.max(...sortedData.slice(0, 60).map(d => d.high));

        let dashboardItems = [
          { name: "3일 가격평균", price: avg3, rate: ((avg3 - curPrc) / curPrc) * 100, isCurrent: false },
          { name: "5일 가격평균", price: avg5, rate: ((avg5 - curPrc) / curPrc) * 100, isCurrent: false },
          { name: "60일 고가", price: max60, rate: ((max60 - curPrc) / curPrc) * 100, isCurrent: false },
          { name: "현재가격", price: curPrc, rate: ((curPrc - prevClose) / prevClose) * 100, isCurrent: true }, 
          { name: "전일종가", price: prevClose, rate: ((prevClose - curPrc) / curPrc) * 100, isCurrent: false },
          { name: "전일고가", price: prevHigh, rate: ((prevHigh - curPrc) / curPrc) * 100, isCurrent: false },
          { name: "당일고가", price: todayHigh, rate: ((todayHigh - curPrc) / curPrc) * 100, isCurrent: false }
        ];

        dashboardItems.sort((a, b) => b.rate - a.rate);

        const tbody = document.getElementById("dashboard-tbody");
        tbody.innerHTML = dashboardItems.map(item => {
          const sign = item.rate > 0 ? "+" : "";
          const displayRate = `${sign}${item.rate.toFixed(2)}%`;
          const displayPrice = Math.round(item.price).toLocaleString();
          
          const rowClass = item.isCurrent ? "class='highlight-row'" : "";
          const customStyle = item.isCurrent ? "style='color: #d63031; font-weight: bold;'" : "";

          return `
            <tr ${rowClass} ${customStyle}>
              <td>${item.name}</td>
              <td style="text-align: right;">${displayPrice}</td>
              <td class="rate-cell">${displayRate}</td>
            </tr>
          `;
        }).join("");
      }

      function updateTimestamp() {
        const timestampElement = document.getElementById("timestamp");
        if (timestampElement) {
          const now = new Date();
          timestampElement.innerText = `최종 업데이트: ${now.toLocaleTimeString()}`;
        }
      }

      async function updateData() {
        try {
          const token = await fetchToken();

          try {
            const stockData = await fetchMarketData(token, chartParams);
            
            const canvas = document.getElementById("stock-chart");
            document.getElementById("stock-msg").innerText = "";
            drawCandleChart(canvas, stockData);
            makePriceDashboard(stockData);

          } catch (err) {
            document.getElementById("stock-msg").className = "error";
            document.getElementById("stock-msg").innerText = `종목 데이터 수신 실패`;
          }

          updateTimestamp();

        } catch (e) {
          console.error("인증 에러:", e);
          const el = document.getElementById("stock-msg");
          if(el) { el.className = "error"; el.innerText = "인증 오류 또는 서버 점검"; }
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateData();
      });
    </script>
  </body>
</html>
