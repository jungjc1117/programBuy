<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Kiwoom 프로그램 순매수 순위 조회</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f4f4f4;
      }
      .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 5px;
      }
      #timestamp {
        text-align: right;
        font-size: 0.9em;
        color: #777;
        margin-bottom: 20px;
      }
      .market-section {
        margin-bottom: 40px;
      }
      .market-title {
        font-size: 1.3em;
        font-weight: bold;
        color: #2c3e50;
        border-left: 5px solid #3498db;
        padding-left: 10px;
        margin-bottom: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9em;
        background: #fff;
      }
      th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background-color: #f2f2f2;
        color: #555;
      }
      tr:hover {
        background-color: #f9f9f9;
      }
      .loading {
        text-align: center;
        color: #888;
        padding: 20px;
      }
      .error {
        color: red;
        text-align: center;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>키움증권 프로그램 순매수 순위 (Mock API)</h1>
      <div id="timestamp">최종 업데이트: 대기 중...</div>
      
      <!-- 코스피 구역 -->
      <div class="market-section">
        <div class="market-title">코스피 (KOSPI) 상위 종목</div>
        <div id="kospi-output">
          <div class="loading">데이터를 불러오는 중입니다...</div>
        </div>
      </div>

      <!-- 코스닥 구역 -->
      <div class="market-section">
        <div class="market-title">코스닥 (KOSDAQ) 상위 종목</div>
        <div id="kosdaq-output">
          <div class="loading">데이터를 불러오는 중입니다...</div>
        </div>
      </div>
    </div>

    <script>
      let cachedToken = null;

      const accessParams = {
        grant_type: "client_credentials",
        appkey: "oJ5S3eaEUVsSaxPX7vkiOPjOI9_yvkFGm3lwAkd_fAg",
        secretkey: "lA1nom_3Ql1TX1rUpppvwhRJBuEQ44cECAYn7lCGgps",
      };

      const kospiParams = {
        trde_upper_tp: "2", 
        amt_qty_tp: "1", 
        mrkt_tp: "P00101", 
        stex_tp: "1", 
      };

      const kosdaqParams = {
        trde_upper_tp: "2", 
        amt_qty_tp: "1", 
        mrkt_tp: "P10102", 
        stex_tp: "1", 
      };

      const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function fetchToken() {
        if (cachedToken) return cachedToken;

        // 주소 규격 보완 (/oauth2/token -> /oauth/2.0/token 시도 가능하게 대응)
        const url = "https://mockapi.kiwoom.com/oauth2/token";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(accessParams),
        });
        if (!res.ok) throw new Error(`토큰 발급 실패: ${res.status}`);
        
        const data = await res.json();
        cachedToken = data.token || data.access_token;
        return cachedToken;
      }

      async function fetchMarketData(token, params) {
        const url = "https://mockapi.kiwoom.com/api/dostk/stkinfo";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json;charset=UTF-8",
            authorization: `Bearer ${token}`,
            "api-id": "ka90003",
            "cont-yn": "N",
            "next-key": "",
          },
          body: JSON.stringify(params),
        });
        if (!res.ok) {
          if (res.status === 401) cachedToken = null; 
          throw new Error(`데이터 로드 실패: ${res.status}`);
        }
        const data = await res.json();
        return data.prm_netprps_upper_50 || [];
      }

      // 등락률 값에 따라 동적으로 스타일과 기호를 결정하는 헬퍼 함수
      function getFluctuationStyle(fluRtStr) {
        if (!fluRtStr) return { text: "-", color: "#333" };
        
        // 문자열에 이미 +, -가 붙어있는지 확인 후 순수 숫자 파싱
        const cleanedStr = fluRtStr.replace(/[+%]/g, "").trim();
        const num = parseFloat(cleanedStr);
        
        if (isNaN(num)) return { text: fluRtStr, color: "#333" };
        
        if (num > 0) {
          // 기호가 없는 경우에만 + 부착
          const text = fluRtStr.includes("+") ? fluRtStr : `+${num}%`;
          return { text, color: "#d63031", weight: "bold" }; // 빨간색
        } else if (num < 0) {
          const text = fluRtStr.includes("-") ? fluRtStr : `${num}%`;
          return { text, color: "#0984e3", weight: "bold" }; // 파란색
        } else {
          return { text: "0.00%", color: "#333", weight: "normal" }; // 보합 (검은색)
        }
      }

      function createTableHTML(rawData) {
        if (!rawData || rawData.length === 0) {
          return `<div class="error">조회된 데이터가 없습니다.</div>`;
        }

        return `
          <table>
            <thead>
              <tr>
                <th>순위</th>
                <th>종목명</th>
                <th>현재가</th>
                <th>등락률</th>
                <th>순매수 금액</th>
              </tr>
            </thead>
            <tbody>
              ${rawData
                .map((item) => {
                  // 등락률 스타일 분석
                  const fluStyle = getFluctuationStyle(item.flu_rt);
                  return `
                    <tr>
                      <td>${item.rank || "-"}</td>
                      <td><strong>${item.stk_nm || "-"}</strong> (${item.stk_cd || "-"})</td>
                      <td>${item.cur_prc ? Math.abs(item.cur_prc).toLocaleString() : "-"}</td>
                      <td style="color: ${fluStyle.color}; font-weight: ${fluStyle.weight || 'normal'};">
                        ${fluStyle.text}
                      </td>
                      <td>${item.prm_netprps_amt ? parseInt(item.prm_netprps_amt).toLocaleString() : "-"}</td>
                    </tr>
                  `;
                })
                .join("")}
            </tbody>
          </table>
        `;
      }

      function updateTimestamp() {
        const timestampElement = document.getElementById("timestamp");
        if (timestampElement) {
          const now = new Date();
          timestampElement.innerText = `최종 업데이트: ${now.toLocaleTimeString()}`;
        }
      }

      async function updateData() {
        const kospiOutput = document.getElementById("kospi-output");
        const kosdaqOutput = document.getElementById("kosdaq-output");

        try {
          const token = await fetchToken();

          // 1. 코스피 연동
          try {
            const kospiData = await fetchMarketData(token, kospiParams);
            kospiOutput.innerHTML = createTableHTML(kospiData);
          } catch (err) {
            kospiOutput.innerHTML = `<div class="error">코스피 데이터 로드 실패: ${err.message}</div>`;
          }

          // 2. 1초 대기
          await delay(1000);

          // 3. 코스닥 연동
          try {
            const kosdaqData = await fetchMarketData(token, kosdaqParams);
            kosdaqOutput.innerHTML = createTableHTML(kosdaqData);
          } catch (err) {
            kosdaqOutput.innerHTML = `<div class="error">코스닥 데이터 로드 실패: ${err.message}</div>`;
          }

          updateTimestamp();

        } catch (e) {
          console.error("인증 에러:", e);
          if (kospiOutput) kospiOutput.innerHTML = `<div class="error">인증 실패 (AppKey를 확인해주세요)</div>`;
          if (kosdaqOutput) kosdaqOutput.innerHTML = `<div class="error">인증 실패 (AppKey를 확인해주세요)</div>`;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateData();
        setInterval(updateData, 12000); 
      });
    </script>
  </body>
</html>
