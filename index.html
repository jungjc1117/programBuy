<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Kiwoom 프로그램 순매수 순위 조회</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f4f4f4;
      }
      .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
      }
      #timestamp {
        text-align: right;
        font-size: 0.9em;
        color: #777;
        margin-bottom: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        font-size: 0.9em;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background-color: #f2f2f2;
        color: #555;
      }
      tr:hover {
        background-color: #f9f9f9;
      }
      .loading {
        text-align: center;
        color: #888;
      }
      .error {
        color: red;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">

      <div id="output"></div>
    </div>

    <script>
      let cachedToken = null;

      const accessParams = {
        grant_type: "client_credentials",
        appkey: "-iQmyxQBQb0jmIS-JTaAbsQ1r7u3NhoMX78hMqBsobY",
        secretkey: "y-fGxZn2OnsyvyqR9kXlTqUiwMuk6IJd6k3xeox0PTo",
      };

      const chartParams = {
        trde_upper_tp: "2", 
        amt_qty_tp: "1", 
        mrkt_tp: "P00000", 
        stex_tp: "1", 
      };

      async function fetchToken() {
        if (cachedToken) return cachedToken;

        const url = "https://mockapi.kiwoom.com/oauth2/token";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(accessParams),
        });
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        const data = await res.json();
        cachedToken = data.token || data.access_token;
        return cachedToken;
      }

      async function fetchProgramTradeRanking(token) {
        const url = "https://mockapi.kiwoom.com/api/dostk/stkinfo";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json;charset=UTF-8",
            authorization: `Bearer ${token}`,
            "api-id": "ka90003",
            "cont-yn": "N",
            "next-key": "",
          },
          body: JSON.stringify(chartParams),
        });
        if (!res.ok) {
          if (res.status === 401) cachedToken = null; 
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        const data = await res.json();
        return data.prm_netprps_upper_50 || [];
      }

      function renderTable(dataList) {
        const outputDiv = document.getElementById("output");
        if (!outputDiv) return;

        const table = document.createElement("table");
        table.innerHTML = `
          <thead>
            <tr>

              <th>종목명</th>

              <th>등락률</th>
              <th>순매수 금액</th>
            </tr>
          </thead>
          <tbody>
            ${dataList
              .map(
                (item) => `
              <tr>

                <td><strong>${item.stk_nm || "-"}</strong></td>

                <td style="color: #d63031; font-weight: bold;">
                  ${item.flu_rt || "-"} %
                </td>
                <td>${item.prm_netprps_amt ? parseInt(item.prm_netprps_amt).toLocaleString() : "-"}</td>
              </tr>
            `
              )
              .join("")}
          </tbody>
        `;
        outputDiv.innerHTML = "";
        outputDiv.appendChild(table);
      }

      function updateTimestamp() {
        const timestampElement = document.getElementById("timestamp");
        if (timestampElement) {
          const now = new Date();
          timestampElement.innerText = `최종 업데이트: ${now.toLocaleTimeString()}`;
        }
      }

      async function updateData() {
        const outputDiv = document.getElementById("output");
        if (!outputDiv) return;

        try {
          outputDiv.innerHTML = `<div class="loading">데이터 불러오는 중...</div>`;
          const token = await fetchToken();
          const programTradeData = await fetchProgramTradeRanking(token);

          if (!programTradeData || programTradeData.length === 0) {
            outputDiv.innerHTML = `<div class="error">API에서 데이터를 가져오지 못했습니다.</div>`;
            return;
          }

          // ★ [핵심 변경] 등락률(flu_rt)이 0보다 큰 데이터만 필터링
          const positiveData = programTradeData.filter(item => {
            const fluRtNum = parseFloat(item.flu_rt);
            return !isNaN(fluRtNum) && fluRtNum > 0;
          });

          if (positiveData.length === 0) {
            outputDiv.innerHTML = `<div class="loading">현재 등락률이 0% 초과인 종목이 없습니다.</div>`;
            updateTimestamp();
            return;
          }

          renderTable(positiveData);
          updateTimestamp();
        } catch (e) {
          console.error("Error during updateData:", e);
          outputDiv.innerHTML = `<div class="error">데이터 로딩 중 에러가 발생했습니다: ${e.message}</div>`;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateData();
        setInterval(updateData, 10000); 
      });
    </script>
  </body>
</html>
