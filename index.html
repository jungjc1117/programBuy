<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Kiwoom 프로그램 순매수 순위 조회</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f4f4f4;
      }
      .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 5px;
      }
      #timestamp {
        text-align: right;
        font-size: 0.9em;
        color: #777;
        margin-bottom: 20px;
      }
      .market-section {
        margin-bottom: 40px;
      }
      .market-title {
        font-size: 1.3em;
        font-weight: bold;
        color: #2c3e50;
        border-left: 5px solid #3498db;
        padding-left: 10px;
        margin-bottom: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9em;
        background: #fff;
      }
      th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background-color: #f2f2f2;
        color: #555;
      }
      tr:hover {
        background-color: #f9f9f9;
      }
      .loading {
        text-align: center;
        color: #888;
        padding: 20px;
      }
      .error {
        color: red;
        text-align: center;
        padding: 20px;
      }
      .mock-badge {
        background-color: #e67e22;
        color: white;
        font-size: 0.75em;
        padding: 2px 6px;
        border-radius: 4px;
        margin-left: 5px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>키움증권 프로그램 순매수 순위 (Mock API)</h1>
      <div id="timestamp">최종 업데이트: 대기 중...</div>
      
      <!-- 코스피 구역 -->
      <div class="market-section">
        <div class="market-title">코스피 (KOSPI) 상위 종목 <span id="kospi-status"></span></div>
        <div id="kospi-output">
          <div class="loading">데이터를 불러오는 중입니다...</div>
        </div>
      </div>

      <!-- 코스닥 구역 -->
      <div class="market-section">
        <div class="market-title">코스닥 (KOSDAQ) 상위 종목 <span id="kosdaq-status"></span></div>
        <div id="kosdaq-output">
          <div class="loading">데이터를 불러오는 중입니다...</div>
        </div>
      </div>
    </div>

    <script>
      let cachedToken = null;

      const accessParams = {
        grant_type: "client_credentials",
        appkey: "oJ5S3eaEUVsSaxPX7vkiOPjOI9_yvkFGm3lwAkd_fAg",
        secretkey: "lA1nom_3Ql1TX1rUpppvwhRJBuEQ44cECAYn7lCGgps",
      };

      // ★ stex_tp를 '1'(KRX단독)에서 가상 데이터가 가장 안정적인 '3'(통합)으로 변경
      const kospiParams = {
        trde_upper_tp: "2", 
        amt_qty_tp: "1", 
        mrkt_tp: "P00101", 
        stex_tp: "3", 
      };

      const kosdaqParams = {
        trde_upper_tp: "2", 
        amt_qty_tp: "1", 
        mrkt_tp: "P10102", 
        stex_tp: "3", 
      };

      // 가상 서버 먹통 대비 백업 데이터 세트
      const backupKospi = [
        { rank: "1", stk_nm: "삼성전자", stk_cd: "005930", cur_prc: "73500", flu_rt: "+1.38", prm_netprps_amt: "125000" },
        { rank: "2", stk_nm: "SK하이닉스", stk_cd: "000660", cur_prc: "142000", flu_rt: "+2.45", prm_netprps_amt: "84000" },
        { rank: "3", stk_nm: "현대차", stk_cd: "005380", cur_prc: "251000", flu_rt: "0.00", prm_netprps_amt: "31000" }
      ];

      const backupKosdaq = [
        { rank: "1", stk_nm: "에코프로비엠", stk_cd: "247540", cur_prc: "223000", flu_rt: "+0.45", prm_netprps_amt: "45000" },
        { rank: "2", stk_nm: "알테오젠", stk_cd: "196170", cur_prc: "178200", flu_rt: "-1.20", prm_netprps_amt: "29000" }
      ];

      const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function fetchToken() {
        if (cachedToken) return cachedToken;
        // 주소 오타 여지 방어 (/oauth2/token)
        const url = "https://mockapi.kiwoom.com/oauth2/token";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(accessParams),
        });
        if (!res.ok) throw new Error(`토큰 발급 실패: ${res.status}`);
        const data = await res.json();
        cachedToken = data.token || data.access_token;
        return cachedToken;
      }

      async function fetchMarketData(token, params) {
        const url = "https://mockapi.kiwoom.com/api/dostk/stkinfo";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json;charset=UTF-8",
            authorization: `Bearer ${token}`,
            "api-id": "ka90003",
            "cont-yn": "N",
            "next-key": "",
          },
          body: JSON.stringify(params),
        });
        if (!res.ok) {
          if (res.status === 401) cachedToken = null; 
          throw new Error(`데이터 로드 실패: ${res.status}`);
        }
        const data = await res.json();
        return data.prm_netprps_upper_50 || [];
      }

      function getFluctuationStyle(fluRtStr) {
        if (!fluRtStr) return { text: "0.00%", color: "#333" };
        const cleanedStr = String(fluRtStr).replace(/[+%]/g, "").trim();
        const num = parseFloat(cleanedStr);
        if (isNaN(num)) return { text: fluRtStr, color: "#333" };
        
        if (num > 0) {
          return { text: fluRtStr.includes("+") ? fluRtStr : `+${num}%`, color: "#d63031", weight: "bold" };
        } else if (num < 0) {
          return { text: fluRtStr.includes("-") ? fluRtStr : `${num}%`, color: "#0984e3", weight: "bold" };
        } else {
          return { text: "0.00%", color: "#333", weight: "normal" };
        }
      }

      function createTableHTML(rawData) {
        return `
          <table>
            <thead>
              <tr>
                <th>순위</th>
                <th>종목명</th>
                <th>현재가</th>
                <th>등락률</th>
                <th>순매수 금액</th>
              </tr>
            </thead>
            <tbody>
              ${rawData
                .map((item) => {
                  const fluStyle = getFluctuationStyle(item.flu_rt);
                  return `
                    <tr>
                      <td>${item.rank || "-"}</td>
                      <td><strong>${item.stk_nm || "-"}</strong> (${item.stk_cd || "-"})</td>
                      <td>${item.cur_prc ? Math.abs(item.cur_prc).toLocaleString() : "-"}</td>
                      <td style="color: ${fluStyle.color}; font-weight: ${fluStyle.weight || 'normal'};">
                        ${fluStyle.text}
                      </td>
                      <td>${item.prm_netprps_amt ? parseInt(item.prm_netprps_amt).toLocaleString() : "-"}</td>
                    </tr>
                  `;
                })
                .join("")}
            </tbody>
          </table>
        `;
      }

      function updateTimestamp() {
        const timestampElement = document.getElementById("timestamp");
        if (timestampElement) {
          const now = new Date();
          timestampElement.innerText = `최종 업데이트: ${now.toLocaleTimeString()}`;
        }
      }

      async function updateData() {
        const kospiOutput = document.getElementById("kospi-output");
        const kosdaqOutput = document.getElementById("kosdaq-output");
        const kospiStatus = document.getElementById("kospi-status");
        const kosdaqStatus = document.getElementById("kosdaq-status");

        try {
          console.log("키움 가상 API 토큰 요청 중...");
          const token = await fetchToken();

          // 1. 코스피 처리
          try {
            let kospiData = await fetchMarketData(token, kospiParams);
            console.log("KOSPI 수신 데이터 수:", kospiData.length);
            
            // 만약 서버에서 빈 데이터를 던져주면 백업 더미데이터 가동
            if (kospiData.length === 0) {
              kospiData = backupKospi;
              kospiStatus.innerHTML = `<span class="mock-badge">백업 데이터 작동</span>`;
            } else {
              kospiStatus.innerHTML = "";
            }
            kospiOutput.innerHTML = createTableHTML(kospiData);
          } catch (err) {
            console.error(err);
            kospiOutput.innerHTML = createTableHTML(backupKospi);
            kospiStatus.innerHTML = `<span class="mock-badge">오류로 인한 백업전환</span>`;
          }

          await delay(1000);

          // 2. 코스닥 처리
          try {
            let kosdaqData = await fetchMarketData(token, kosdaqParams);
            console.log("KOSDAQ 수신 데이터 수:", kosdaqData.length);
            
            if (kosdaqData.length === 0) {
              kosdaqData = backupKosdaq;
              kosdaqStatus.innerHTML = `<span class="mock-badge">백업 데이터 작동</span>`;
            } else {
              kosdaqStatus.innerHTML = "";
            }
            kosdaqOutput.innerHTML = createTableHTML(kosdaqData);
          } catch (err) {
            console.error(err);
            kosdaqOutput.innerHTML = createTableHTML(backupKosdaq);
            kosdaqStatus.innerHTML = `<span class="mock-badge">오류로 인한 백업전환</span>`;
          }

          updateTimestamp();

        } catch (e) {
          console.error("인증 시스템 전면 차단 에러:", e);
          // 토큰 발급마저 막혔을 때 화면 전체 백업 출력 보장
          kospiOutput.innerHTML = createTableHTML(backupKospi);
          kosdaqOutput.innerHTML = createTableHTML(backupKosdaq);
          kospiStatus.innerHTML = `<span class="mock-badge">서버 점검(백업 모드)</span>`;
          kosdaqStatus.innerHTML = `<span class="mock-badge">서버 점검(백업 모드)</span>`;
          updateTimestamp();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateData();
        setInterval(updateData, 12000); 
      });
    </script>
  </body>
</html>
