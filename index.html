<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Kiwoom 프로그램 순매수 순위 조회</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f4f4f4;
      }
      .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
        margin-bottom: 5px;
      }
      #timestamp {
        text-align: right;
        font-size: 0.9em;
        color: #777;
        margin-bottom: 20px;
      }
      .market-section {
        margin-bottom: 20px;
      }
      .market-title {
        font-size: 1.3em;
        font-weight: bold;
        color: #2c3e50;
        border-left: 5px solid #3498db;
        padding-left: 10px;
        margin-bottom: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9em;
        background: #fff;
      }
      th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background-color: #f2f2f2;
        color: #555;
      }
      tr:hover {
        background-color: #f9f9f9;
      }
      .loading {
        text-align: center;
        color: #888;
        padding: 20px;
      }
      .error {
        color: red;
        text-align: center;
        padding: 20px;
      }
      .no-data {
        color: #7f8c8d;
        text-align: center;
        padding: 15px;
        background: #fafafa;
        border: 1px dashed #ccc;
      }
    </style>
  </head>
  <body>
    <div class="container">
      
      <!-- 코스피 출력 구역 -->
      <div class="market-section">
        <div id="kospi-output">
          <div class="loading">데이터를 불러오는 중입니다...</div>
        </div>
      </div>

      <!-- 코스닥 출력 구역 -->
      <div class="market-section">
          <div id="kosdaq-output">
          <div class="loading">데이터를 불러오는 중입니다...</div>
        </div>
      </div>
    </div>

    <script>
      let cachedToken = null;

      const accessParams = {
        grant_type: "client_credentials",
        appkey: "-iQmyxQBQb0jmIS-JTaAbsQ1r7u3NhoMX78hMqBsobY",
        secretkey: "y-fGxZn2OnsyvyqR9kXlTqUiwMuk6IJd6k3xeox0PTo",
      };

      const chartParamsKospi = {
        trde_upper_tp: "2", 
        amt_qty_tp: "1", 
        mrkt_tp: "P00101", 
        stex_tp: "1", 
      };
      
      const chartParamsKosdaq = {
        trde_upper_tp: "2", 
        amt_qty_tp: "1", 
        mrkt_tp: "P10102", 
        stex_tp: "1", 
      };

      const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function fetchToken() {
        if (cachedToken) return cachedToken;
        const url = "https://mockapi.kiwoom.com/oauth2/token";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(accessParams),
        });
        if (!res.ok) throw new Error(`토큰 발급 에러: ${res.status}`);
        const data = await res.json();
        cachedToken = data.token || data.access_token;
        return cachedToken;
      }

      async function fetchMarketData(token, params) {
        const url = "https://mockapi.kiwoom.com/api/dostk/stkinfo";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json;charset=UTF-8",
            authorization: `Bearer ${token}`,
            "api-id": "ka90003",
            "cont-yn": "N",
            "next-key": "",
          },
          body: JSON.stringify(params),
        });
        if (!res.ok) {
          if (res.status === 401) cachedToken = null; 
          throw new Error(`데이터 통신 에러: ${res.status}`);
        }
        const data = await res.json();
        return data.prm_netprps_upper_50 || [];
      }

      // 테이블 렌더링 및 문자열 기반 완벽한 (+) 필터링 함수
      function createTableHTML(rawData) {
        if (!rawData || rawData.length === 0) {
          return `<div class="error">조회된 데이터가 없습니다.</div>`;
        }

        // 수신된 문자열 데이터에 '+' 기호가 명시적으로 포함되어 있는 종목만 필터링
        const positiveData = rawData.filter(item => {
          if (!item.flu_rt) return false;
          return String(item.flu_rt).trim().includes("+");
        });

        // 만약 장중 상승(영업일 기준) 종목이 하나도 없을 때 에러 대신 안내 문구 노출
        if (positiveData.length === 0) {
          return `<div class="no-data">현재 등락률이 + 인 상승 종목이 없습니다.</div>`;
        }

        return `
          <table>
            <thead>
              <tr>
                <th>종목명</th>
                <th>등락률</th>
                <th>순매수 금액</th>
              </tr>
            </thead>
            <tbody>
              ${positiveData
                .map((item) => {
                  // 기호 처리가 깔끔하게 끝난 텍스트 그대로 매핑하고 % 기호 중복을 방어합니다.
                  let displayFluRt = String(item.flu_rt).trim();
                  if (!displayFluRt.includes("%")) displayFluRt += " %";

                  return `
                    <tr>
                      <td><strong>${item.stk_nm || "-"}</strong></td>
                      <td style="color: #d63031; font-weight: bold;">
                        ${displayFluRt}
                      </td>
                      <td>${item.prm_netprps_amt ? parseInt(item.prm_netprps_amt).toLocaleString() : "-"}</td>
                    </tr>
                  `;
                })
                .join("")}
            </tbody>
          </table>
        `;
      }

      function updateTimestamp() {
        const timestampElement = document.getElementById("timestamp");
        if (timestampElement) {
          const now = new Date();
          timestampElement.innerText = `최종 업데이트: ${now.toLocaleTimeString()}`;
        }
      }

      async function updateData() {
        const kospiOutput = document.getElementById("kospi-output");
        const kosdaqOutput = document.getElementById("kosdaq-output");

        try {
          const token = await fetchToken();

          // 1. 코스피 연동
          try {
            const kospiData = await fetchMarketData(token, chartParamsKospi);
            kospiOutput.innerHTML = createTableHTML(kospiData);
          } catch (err) {
            kospiOutput.innerHTML = `<div class="error">코스피 수신 실패: ${err.message}</div>`;
          }

          // 2. 부하 방지용 1초 대기
          await delay(1000);

          // 3. 코스닥 연동
          try {
            const kosdaqData = await fetchMarketData(token, chartParamsKosdaq);
            kosdaqOutput.innerHTML = createTableHTML(kosdaqData);
          } catch (err) {
            kosdaqOutput.innerHTML = `<div class="error">코스닥 수신 실패: ${err.message}</div>`;
          }

          updateTimestamp();

        } catch (e) {
          console.error("인증 토큰 에러:", e);
          if (kospiOutput) kospiOutput.innerHTML = `<div class="error">인증 오류 또는 가상 서버 점검 중입니다.</div>`;
          if (kosdaqOutput) kosdaqOutput.innerHTML = `<div class="error">인증 오류 또는 가상 서버 점검 중입니다.</div>`;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateData();
        setInterval(updateData, 12000); 
      });
    </script>
  </body>
</html>
