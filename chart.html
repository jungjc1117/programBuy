<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kiwoom 프로그램 비차익 추이 차트</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        background-color: #f4f4f4;
        margin: 0;
      }
      .container {
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
        margin: auto;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
        font-size: 1.3em;
        margin-bottom: 5px;
      }
      #timestamp {
        text-align: right;
        font-size: 0.8em;
        color: #777;
        margin-bottom: 15px;
      }
      .market-section {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .market-title {
        width: 300px;
        font-size: 0.95em;
        font-weight: bold;
        color: #2c3e50;
        border-left: 4px solid #3498db;
        padding-left: 8px;
        margin-bottom: 8px;
        text-align: left;
      }
      .chart-wrapper {
        width: 300px;
        height: 100px;
        background: #fafafa;
        border: 1px solid #e8e8e8;
        border-radius: 4px;
        position: relative;
      }
      canvas {
        display: block;
      }
      .loading, .error, .no-data {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 0.85em;
        color: #888;
        width: 100%;
        text-align: center;
      }
      .error { color: red; }
    </style>
  </head>
  <body>
    <div class="container">
      
      <!-- 코스피 차트 구역 -->
      <div class="market-section">
        <div class="chart-wrapper">
          <canvas id="kospi-chart" width="300" height="100"></canvas>
          <div id="kospi-msg" class="loading">데이터를 불러오는 중...</div>
        </div>
      </div>

      <!-- 코스닥 차트 구역 -->
      <div class="market-section">
        <div class="chart-wrapper">
          <canvas id="kosdaq-chart" width="300" height="100"></canvas>
          <div id="kosdaq-msg" class="loading">데이터를 불러오는 중...</div>
        </div>
      </div>
    </div>

    <script>
      let cachedToken = null;

      const accessParams = {
        grant_type: "client_credentials",
        appkey: "-iQmyxQBQb0jmIS-JTaAbsQ1r7u3NhoMX78hMqBsobY",
        secretkey: "y-fGxZn2OnsyvyqR9kXlTqUiwMuk6IJd6k3xeox0PTo",
      };

      const chartParamsKospi = {
        date: '20241101',
        amt_qty_tp: '1', 
        mrkt_tp: 'P00101', 
        min_tic_tp: '1', 
        stex_tp: '3', 
      };
      
      const chartParamsKosdaq = {
        date: '20241101',
        amt_qty_tp: '1', 
        mrkt_tp: 'P10102', 
        min_tic_tp: '1', 
        stex_tp: '3', 
      };

      const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function fetchToken() {
        if (cachedToken) return cachedToken;
        const url = "https://mockapi.kiwoom.com/oauth2/token";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(accessParams),
        });
        if (!res.ok) throw new Error(`토큰 발급 에러: ${res.status}`);
        const data = await res.json();
        cachedToken = data.token || data.access_token;
        return cachedToken;
      }

      async function fetchMarketData(token, params) {
        const url = "https://mockapi.kiwoom.com/api/dostk/mrkcond";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json;charset=UTF-8",
            authorization: `Bearer ${token}`,
            "api-id": "ka90005",
            "cont-yn": "N",
            "next-key": "",
          },
          body: JSON.stringify(params),
        });
        if (!res.ok) {
          if (res.status === 401) cachedToken = null; 
          throw new Error(`데이터 통신 에러: ${res.status}`);
        }
        const data = await res.json();
        return data.prm_trde_trnsn || [];
      }

      function parseNetprps(value) {
        if (!value) return 0;
        let cleanValue = value.replace(/--/g, '-').replace(/\+/g, '');
        return parseFloat(cleanValue) || 0;
      }

      // ★ [양수/음수별 색상 자동 변경 로직이 추가된 차트 함수]
      function drawMiniChart(canvasId, msgId, rawData) {
        const canvas = document.getElementById(canvasId);
        const msgDiv = document.getElementById(msgId);
        
        if (!rawData || rawData.length === 0) {
          msgDiv.className = "no-data";
          msgDiv.innerText = "데이터가 없습니다.";
          return;
        }

        // 1. 데이터 정제 및 시간 순 정렬
        let chartData = rawData.map(item => ({
          time: item.cntr_tm || "",
          value: parseNetprps(item.ndiffpro_trde_netprps)
        }));
        
        chartData.sort((a, b) => a.time.localeCompare(b.time));

        msgDiv.innerText = ""; 
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const padding = 8;

        // 2. Y축 최대/최소값 계산
        const values = chartData.map(d => d.value);
        let minVal = Math.min(...values);
        let maxVal = Math.max(...values);

        if (minVal === maxVal) {
          minVal -= 100;
          maxVal += 100;
        }

        const yRange = maxVal - minVal;
        const xStep = (width - padding * 2) / (chartData.length - 1 || 1);

        // ⭐️ 3. 가장 최근(마지막) 데이터의 상태에 따라 테마 색상 결정
        const latestValue = chartData[chartData.length - 1].value;
        let themeColor = '#1565c0'; // 기본 음수 테마: 파란색
        let fillColor = 'rgba(21, 101, 192, 0.15)';
        
        if (latestValue > 0) {
          themeColor = '#d32f2f'; // 양수 테마: 빨간색
          fillColor = 'rgba(211, 47, 47, 0.15)';
        }

        // 캔버스 초기화
        ctx.clearRect(0, 0, width, height);

        // 4. 추이 선 그리기
        ctx.beginPath();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = themeColor; // 결정된 테마 색상 적용
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        chartData.forEach((point, index) => {
          const x = padding + (index * xStep);
          const y = height - padding - ((point.value - minVal) / yRange * (height - padding * 2));
          
          if (index === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.stroke();

        // 5. 하단 채우기 효과 (결정된 그라데이션 적용)
        ctx.lineTo(padding + ((chartData.length - 1) * xStep), height);
        ctx.lineTo(padding, height);
        ctx.closePath();
        
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, fillColor);
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
        ctx.fillStyle = gradient;
        ctx.fill();
      }

      function updateTimestamp() {
        const timestampElement = document.getElementById("timestamp");
        if (timestampElement) {
          const now = new Date();
          timestampElement.innerText = `최종 업데이트: ${now.toLocaleTimeString()}`;
        }
      }

      async function updateData() {
        try {
          const token = await fetchToken();

          // 1. 코스피 데이터 수신 및 차트 드로잉
          try {
            const kospiData = await fetchMarketData(token, chartParamsKospi);
            drawMiniChart("kospi-chart", "kospi-msg", kospiData);
          } catch (err) {
            document.getElementById("kospi-msg").className = "error";
            document.getElementById("kospi-msg").innerText = `코스피 수신 실패`;
          }

          // 2. 1초 대기
          await delay(1000);

          // 3. 코스닥 데이터 수신 및 차트 드로잉
          try {
            const kosdaqData = await fetchMarketData(token, chartParamsKosdaq);
            drawMiniChart("kosdaq-chart", "kosdaq-msg", kosdaqData);
          } catch (err) {
            document.getElementById("kosdaq-msg").className = "error";
            document.getElementById("kosdaq-msg").innerText = `코스닥 수신 실패`;
          }

          updateTimestamp();

        } catch (e) {
          console.error("인증 에러:", e);
          const msgs = ["kospi-msg", "kosdaq-msg"];
          msgs.forEach(id => {
            const el = document.getElementById(id);
            if(el) { el.className = "error"; el.innerText = "인증 오류 또는 서버 점검"; }
          });
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateData();
        setInterval(updateData, 12000); 
      });
    </script>
  </body>
</html>
