<!--프로그램일자별-->>
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kiwoom 프로그램 일자별 추이 차트</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        background-color: #f4f4f4;
        margin: 0;
      }
      .container {
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
        margin: auto;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
        font-size: 1.3em;
        margin-bottom: 5px;
      }
      #timestamp {
        text-align: right;
        font-size: 0.8em;
        color: #777;
        margin-bottom: 15px;
      }
      .market-section {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .market-title {
        width: 300px;
        font-size: 0.95em;
        font-weight: bold;
        color: #2c3e50;
        border-left: 4px solid #3498db;
        padding-left: 8px;
        margin-bottom: 8px;
        text-align: left;
      }
      .chart-wrapper {
        width: 300px;
        height: 120px; /* 봉차트의 위아래 대칭 균형을 위해 높이를 살짝 올렸습니다 */
        background: #fafafa;
        border: 1px solid #e8e8e8;
        border-radius: 4px;
        position: relative;
      }
      canvas {
        display: block;
      }
      .loading, .error, .no-data {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 0.85em;
        color: #888;
        width: 100%;
        text-align: center;
      }
      .error { color: red; }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="timestamp">최종 업데이트: -</div>
      
      <!-- 코스피 차트 구역 -->
      <div class="market-section">
        <div class="market-title">코스피 프로그램 일자별 추이</div>
        <div class="chart-wrapper">
          <canvas id="kospi-chart" width="300" height="120"></canvas>
          <div id="kospi-msg" class="loading">데이터를 불러오는 중...</div>
        </div>
      </div>

      <!-- 코스닥 차트 구역 -->
      <div class="market-section">
        <div class="market-title">코스닥 프로그램 일자별 추이</div>
        <div class="chart-wrapper">
          <canvas id="kosdaq-chart" width="300" height="120"></canvas>
          <div id="kosdaq-msg" class="loading">데이터를 불러오는 중...</div>
        </div>
      </div>
    </div>

    <script>
      let cachedToken = null;

      const accessParams = {
        grant_type: "client_credentials",
        appkey: "-iQmyxQBQb0jmIS-JTaAbsQ1r7u3NhoMX78hMqBsobY",
        secretkey: "y-fGxZn2OnsyvyqR9kXlTqUiwMuk6IJd6k3xeox0PTo",
      };

      // 2026년 가상 날짜 파라미터 적용
      const chartParamsKospi = { date: '20261231', amt_qty_tp: '1', mrkt_tp: 'P00101', min_tic_tp: '1', stex_tp: '3' };
      const chartParamsKosdaq = { date: '20261231', amt_qty_tp: '1', mrkt_tp: 'P10102', min_tic_tp: '1', stex_tp: '3' };

      const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function fetchToken() {
        if (cachedToken) return cachedToken;
        const url = "https://mockapi.kiwoom.com/oauth2/token";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(accessParams),
        });
        if (!res.ok) throw new Error(`토큰 발급 에러: ${res.status}`);
        const data = await res.json();
        cachedToken = data.token || data.access_token;
        return cachedToken;
      }

      async function fetchMarketData(token, params) {
        const url = "https://mockapi.kiwoom.com/api/dostk/mrkcond";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json;charset=UTF-8",
            authorization: `Bearer ${token}`,
            "api-id": "ka90010",
            "cont-yn": "N",
            "next-key": "",
          },
          body: JSON.stringify(params),
        });
        if (!res.ok) {
          if (res.status === 401) cachedToken = null; 
          throw new Error(`데이터 통신 에러: ${res.status}`);
        }
        const data = await res.json();
        return data.prm_trde_trnsn || [];
      }

      function parseNetprps(value) {
        if (!value) return 0;
        let cleanValue = value.replace(/--/g, '-').replace(/\+/g, '');
        return parseFloat(cleanValue) || 0;
      }

      // 🛠️ [수정됨] 0축 기준 양수/음수 봉차트(Bar Chart) 렌더링 함수
      function drawMiniBarChart(canvasId, msgId, rawData) {
        const canvas = document.getElementById(canvasId);
        const msgDiv = document.getElementById(msgId);
        
        if (!rawData || rawData.length === 0) {
          msgDiv.className = "no-data";
          msgDiv.innerText = "데이터가 없습니다.";
          return;
        }

        // 1. 시간 순 정렬
        let chartData = rawData.map(item => ({
          time: item.cntr_tm || "",
          value: parseNetprps(item.all_netprps)
        }));
        chartData.sort((a, b) => a.time.localeCompare(b.time));

        msgDiv.innerText = ""; 
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const paddingY = 10; // 위아래 여백
        const paddingX = 5;  // 좌우 여백

        // 2. Y축의 절대값 최대치 계산 (0을 기준으로 대칭 정렬하기 위함)
        const values = chartData.map(d => d.value);
        const maxAbsVal = Math.max(...values.map(v => Math.abs(v)), 100); // 최소 100 기본선 보장

        // 3. 0 기준선의 Y 좌표 계산 (정중앙 위치)
        const yZero = height / 2;

        // 4. 봉 그리기 정보 설정
        const dataCount = chartData.length;
        const availableWidth = width - (paddingX * 2);
        
        // 봉의 너비와 간격 자동 계산
        const barWidth = Math.max(1.5, (availableWidth / dataCount) * 0.7);
        const xStep = availableWidth / (dataCount - 1 || 1);

        // 캔버스 초기화
        ctx.clearRect(0, 0, width, height);

        // 5. 0 수평 기준선(다크 그레이 점선) 그리기
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = '#b2bec3';
        ctx.lineWidth = 1;
        ctx.moveTo(0, yZero);
        ctx.lineTo(width, yZero);
        ctx.stroke();
        ctx.restore();

        // 6. 데이터 순회하며 위아래로 봉(Bar) 그리기
        chartData.forEach((point, index) => {
          const x = paddingX + (index * xStep) - (barWidth / 2);
          
          // 데이터 값을 픽셀 높이 크기로 변환
          // (yZero에서 가용한 상하 최대 높이만큼 비율 배정)
          const usableHeight = (height / 2) - paddingY;
          const barHeight = (point.value / maxAbsVal) * usableHeight;

          // 색상 결정 (양수: 빨간색, 음수: 파란색)
          if (point.value >= 0) {
            ctx.fillStyle = '#e17055'; // 화사한 상승 빨간색
          } else {
            ctx.fillStyle = '#0984e3'; // 화사한 하락 파란색
          }

          // 사각형 그리기 (x, y, width, height)
          // 캔버스는 y축이 아래로 갈수록 커지므로 음수일 때와 양수일 때 시작점이 달라집니다.
          ctx.fillRect(x, yZero, barWidth, -barHeight);
        });
      }

      function updateTimestamp() {
        const timestampElement = document.getElementById("timestamp");
        if (timestampElement) {
          const now = new Date();
          timestampElement.innerText = `최종 업데이트: ${now.toLocaleTimeString()}`;
        }
      }

      async function updateData() {
        try {
          const token = await fetchToken();

          // 1. 코스피 봉차트 렌더링
          try {
            const kospiData = await fetchMarketData(token, chartParamsKospi);
            drawMiniBarChart("kospi-chart", "kospi-msg", kospiData);
          } catch (err) {
            document.getElementById("kospi-msg").className = "error";
            document.getElementById("kospi-msg").innerText = `코스피 수신 실패`;
          }

          await delay(1000);

          // 2. 코스닥 봉차트 렌더링
          try {
            const kosdaqData = await fetchMarketData(token, chartParamsKosdaq);
            drawMiniBarChart("kosdaq-chart", "kosdaq-msg", kosdaqData);
          } catch (err) {
            document.getElementById("kosdaq-msg").className = "error";
            document.getElementById("kosdaq-msg").innerText = `코스닥 수신 실패`;
          }

          updateTimestamp();

        } catch (e) {
          console.error("인증 에러:", e);
          const msgs = ["kospi-msg", "kosdaq-msg"];
          msgs.forEach(id => {
            const el = document.getElementById(id);
            if(el) { el.className = "error"; el.innerText = "인증 오류 또는 서버 점검"; }
          });
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateData();
        setInterval(updateData, 12000); 
      });
    </script>
  </body>
</html>
