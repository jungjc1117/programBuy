<!--프로그램순매수상위와프로그램시간대별-->>
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kiwoom 프로그램 순매수 순위 및 추이 조회</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        background-color: #f4f4f4;
        margin: 0;
      }
      .container {
        width: 100%;
        max-width: 600px;
        box-sizing: border-box;
        margin: auto;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        color: #333;
        font-size: 1.4em;
        margin-bottom: 5px;
      }
      #timestamp {
        text-align: right;
        font-size: 0.85em;
        color: #777;
        margin-bottom: 15px;
      }
      .market-section {
        margin-bottom: 30px;
        background: #fff;
      }
      .market-title {
        font-size: 1.1em;
        font-weight: bold;
        color: #2c3e50;
        border-left: 5px solid #3498db;
        padding-left: 10px;
        margin-bottom: 12px;
      }
      
      .chart-container {
        display: flex;
        justify-content: center;
        margin-bottom: 15px;
        width: 100%;
      }
      .chart-wrapper {
        width: 100%;
        height: 100px;
        background: #fafafa;
        border: 1px solid #e8e8e8;
        border-radius: 4px;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100px;
      }

      .table-wrapper {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 1em;
        background: #fff;
        table-layout: fixed;
      }
      th, td {
        padding: 10px 6px;
        text-align: left;
        border-bottom: 1px solid #ddd;
        word-break: break-all;
      }
      /* 헤더가 없어도 열의 비율을 유지하기 위한 너비 조정 */
      .col-1 { width: 45%; } 
      .col-2 { width: 25%; }
      .col-3 { width: 30%; text-align: right; }
      
      tr:hover {
        background-color: #f9f9f9;
      }
      .loading {
        text-align: center;
        color: #888;
        padding: 20px;
      }
      .chart-wrapper .loading, .chart-wrapper .error, .chart-wrapper .no-data {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 0;
        font-size: 0.85em;
        width: 100%;
      }
      .error {
        color: red;
        text-align: center;
        padding: 20px;
      }
      .no-data {
        color: #7f8c8d;
        text-align: center;
        padding: 15px;
        background: #fafafa;
        border: 1px dashed #ccc;
        font-size: 0.9em;
      }

      @media (max-width: 480px) {
        body { padding: 5px; }
        .container { padding: 10px; }
        h1 { font-size: 1.2em; }
        table { font-size: 0.95em; }
        th, td { padding: 8px 4px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>프로그램 순매수</h1>
      
      <!-- 코스피 구역 -->
      <div class="market-section">
        <div class="market-title">코스피 (KOSPI)</div>
        <div class="chart-container">
          <div class="chart-wrapper">
            <canvas id="kospi-chart"></canvas>
            <div id="kospi-msg" class="loading">차트 데이터를 불러오는 중...</div>
          </div>
        </div>
        <div id="kospi-output">
          <div class="loading">순위 데이터를 불러오는 중입니다...</div>
        </div>
      </div>

      <!-- 코스닥 구역 -->
      <div class="market-section">
        <div class="market-title">코스닥 (KOSDAQ)</div>
        <div class="chart-container">
          <div class="chart-wrapper">
            <canvas id="kosdaq-chart"></canvas>
            <div id="kosdaq-msg" class="loading">차트 데이터를 불러오는 중...</div>
          </div>
        </div>
        <div id="kosdaq-output">
          <div class="loading">순위 데이터를 불러오는 중입니다...</div>
        </div>
      </div>
    </div>

    <script>
      let cachedToken = null;
      let latestKospiChartData = [];
      let latestKosdaqChartData = [];

      const accessParams = {
        grant_type: "client_credentials",
        appkey: "-iQmyxQBQb0jmIS-JTaAbsQ1r7u3NhoMX78hMqBsobY",
        secretkey: "y-fGxZn2OnsyvyqR9kXlTqUiwMuk6IJd6k3xeox0PTo",
      };

      const tableParamsKospi = { trde_upper_tp: "2", amt_qty_tp: "1", mrkt_tp: "P00101", stex_tp: "1" };
      const tableParamsKosdaq = { trde_upper_tp: "2", amt_qty_tp: "1", mrkt_tp: "P10102", stex_tp: "1" };

      const graphParamsKospi = { date: '20241101', amt_qty_tp: '1', mrkt_tp: 'P00101', min_tic_tp: '1', stex_tp: '3' };
      const graphParamsKosdaq = { date: '20241101', amt_qty_tp: '1', mrkt_tp: 'P10102', min_tic_tp: '1', stex_tp: '3' };

      const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

      async function fetchToken() {
        if (cachedToken) return cachedToken;
        const url = "https://mockapi.kiwoom.com/oauth2/token";
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json;charset=UTF-8" },
          body: JSON.stringify(accessParams),
        });
        if (!res.ok) throw new Error(`토큰 발급 에러: ${res.status}`);
        const data = await res.json();
        cachedToken = data.token || data.access_token;
        return cachedToken;
      }

      async function fetchMarketDataChart(token, params) {
        const url = "https://mockapi.kiwoom.com/api/dostk/mrkcond";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json;charset=UTF-8",
            authorization: `Bearer ${token}`,
            "api-id": "ka90005",
            "cont-yn": "N",
            "next-key": "",
          },
          body: JSON.stringify(params),
        });
        if (!res.ok) {
          if (res.status === 401) cachedToken = null; 
          throw new Error(`데이터 통신 에러: ${res.status}`);
        }
        const data = await res.json();
        return data.prm_trde_trnsn || [];
      }

      async function fetchMarketDataTable(token, params) {
        const url = "https://mockapi.kiwoom.com/api/dostk/stkinfo";
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json;charset=UTF-8",
            authorization: `Bearer ${token}`,
            "api-id": "ka90003",
            "cont-yn": "N",
            "next-key": "",
          },
          body: JSON.stringify(params),
        });
        if (!res.ok) {
          if (res.status === 401) cachedToken = null; 
          throw new Error(`데이터 통신 에러: ${res.status}`);
        }
        const data = await res.json();
        return data.prm_netprps_upper_50 || [];
      }

      function parseNetprps(value) {
        if (value === undefined || value === null) return 0;
        let cleanValue = String(value).replace(/,/g, '').replace(/--/g, '-').replace(/\+/g, '').trim();
        let parsed = parseFloat(cleanValue);
        return isNaN(parsed) ? 0 : parsed;
      }

      function drawMiniChart(canvasId, msgId, rawData) {
        const canvas = document.getElementById(canvasId);
        const msgDiv = document.getElementById(msgId);
        
        if (!rawData || rawData.length === 0) {
          msgDiv.className = "no-data";
          msgDiv.innerText = "데이터가 없습니다.";
          return;
        }

        let chartData = rawData.map(item => ({
          time: item.cntr_tm ? String(item.cntr_tm).trim() : "",
          value: parseNetprps(item.ndiffpro_trde_netprps)
        })).filter(item => item.time !== "");
        
        if (chartData.length === 0) {
          msgDiv.className = "no-data";
          msgDiv.innerText = "유효한 차트 데이터 없음";
          return;
        }

        chartData.sort((a, b) => a.time.localeCompare(b.time));
        msgDiv.innerText = ""; 

        const rect = canvas.parentNode.getBoundingClientRect();
        canvas.width = rect.width;   
        canvas.height = 100;         

        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const padding = 10;

        const values = chartData.map(d => d.value);
        let minVal = Math.min(...values);
        let maxVal = Math.max(...values);

        if (minVal === maxVal) {
          minVal -= 100;
          maxVal += 100;
        }

        const yRange = maxVal - minVal;
        const xStep = (width - padding * 2) / (chartData.length - 1 || 1);

        const latestValue = chartData[chartData.length - 1].value;
        let themeColor = '#1565c0'; 
        let fillColor = 'rgba(21, 101, 192, 0.12)';
        
        if (latestValue >= 0) {
          themeColor = '#d32f2f'; 
          fillColor = 'rgba(211, 47, 47, 0.12)';
        }

        ctx.clearRect(0, 0, width, height);

        ctx.beginPath();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = themeColor;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        chartData.forEach((point, index) => {
          const x = padding + (index * xStep);
          const y = padding + ((maxVal - point.value) / yRange * (height - padding * 2));
          
          if (index === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.stroke();

        const lastX = padding + ((chartData.length - 1) * xStep);
        ctx.lineTo(lastX, height);
        ctx.lineTo(padding, height);
        ctx.closePath();
        
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, fillColor);
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
        ctx.fillStyle = gradient;
        ctx.fill();
      }

      function createTableHTML(rawData) {
        if (!rawData || rawData.length === 0) {
          return `<div class="error">조회된 데이터가 없습니다.</div>`;
        }

        const positiveData = rawData.filter(item => {
          if (!item.flu_rt) return false;
          return String(item.flu_rt).trim().includes("+");
        });

        if (positiveData.length === 0) {
          return `<div class="no-data">현재 등락률이 + 인 상승 종목이 없습니다.</div>`;
        }

        // ★ 변경점: <thead>(종목명, 등락률, 순매수액 열 헤더)을 제거하고 곧바로 데이터 렌더링
        return `
          <div class="table-wrapper">
            <table>
              <!-- 너비 정렬을 위해 colgroup만 정의 -->
              <colgroup>
                <col class="col-1">
                <col class="col-2">
                <col class="col-3">
              </colgroup>
              <tbody>
                ${positiveData
                  .map((item) => {
                    let displayFluRt = String(item.flu_rt).trim();
                    if (!displayFluRt.includes("%")) displayFluRt += "%";

                    return `
                      <tr>
                        <td><strong>${item.stk_nm || "-"}</strong></td>
                        <td style="color: #d63031; font-weight: bold;">${displayFluRt}</td>
                        <td style="text-align: right;">${item.prm_netprps_amt ? parseInt(item.prm_netprps_amt.replace(/,/g, '')).toLocaleString() : "-"}</td>
                      </tr>
                    `;
                  })
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function updateTimestamp() {
        const timestampElement = document.getElementById("timestamp");
        if (timestampElement) {
          const now = new Date();
          timestampElement.innerText = `최종 업데이트: ${now.toLocaleTimeString()}`;
        }
      }

      async function updateData() {
        const kospiOutput = document.getElementById("kospi-output");
        const kosdaqOutput = document.getElementById("kosdaq-output");

        try {
          const token = await fetchToken();

          // 1. 코스피 테이블
          try {
            const kospiTableData = await fetchMarketDataTable(token, tableParamsKospi);
            kospiOutput.innerHTML = createTableHTML(kospiTableData);
          } catch (err) {
            kospiOutput.innerHTML = `<div class="error">코스피 순위 수신 실패</div>`;
          }

          await delay(1500); 

          // 2. 코스닥 테이블
          try {
            const kosdaqTableData = await fetchMarketDataTable(token, tableParamsKosdaq);
            kosdaqOutput.innerHTML = createTableHTML(kosdaqTableData);
          } catch (err) {
            kosdaqOutput.innerHTML = `<div class="error">코스닥 순위 수신 실패</div>`;
          }

          await delay(1500); 

          // 3. 코스피 차트
          try {
            latestKospiChartData = await fetchMarketDataChart(token, graphParamsKospi);
            drawMiniChart("kospi-chart", "kospi-msg", latestKospiChartData);
          } catch (err) {
            document.getElementById("kospi-msg").className = "error";
            document.getElementById("kospi-msg").innerText = `코스피 차트 실패`;
          }

          await delay(1500); 

          // 4. 코스닥 차트
          try {
            latestKosdaqChartData = await fetchMarketDataChart(token, graphParamsKosdaq);
            drawMiniChart("kosdaq-chart", "kosdaq-msg", latestKosdaqChartData);
          } catch (err) {
            document.getElementById("kosdaq-msg").className = "error";
            document.getElementById("kosdaq-msg").innerText = `코스닥 차트 실패`;
          }

          updateTimestamp();

        } catch (e) {
          console.error(e);
          if (kospiOutput) kospiOutput.innerHTML = `<div class="error">데이터 로드 실패</div>`;
        }
      }

      window.addEventListener("resize", () => {
        if (latestKospiChartData.length > 0) {
          drawMiniChart("kospi-chart", "kospi-msg", latestKospiChartData);
        }
        if (latestKosdaqChartData.length > 0) {
          drawMiniChart("kosdaq-chart", "kosdaq-msg", latestKosdaqChartData);
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        updateData();
        setInterval(updateData, 20000); 
      });
    </script>
  </body>
</html>
